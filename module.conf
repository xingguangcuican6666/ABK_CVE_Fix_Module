# ABK external module metadata.
#
# Keep this file shell-compatible because setup.sh sources it, and keep values
# plain because the ABK app and module catalogs parse it before adding modules.

ABK_MODULE_ID="abk_cve_patcher"
ABK_MODULE_NAME="ABK CVE Patcher"
ABK_MODULE_VERSION="1.1.3"
ABK_MODULE_DESCRIPTION="Backport Android Security Bulletin kernel CVE fixes (2025-12 ~ 2026-07) and selected upstream 6.1 fixes into the GKI source tree during the build."
ABK_MODULE_REPO_URL="https://github.com/xingguangcuican6666/ABK_CVE_Fix_Module"
ABK_MODULE_SUPPORTED_STAGES="after_patch,before_build"
ABK_MODULE_DEFAULT_STAGE="after_patch"
ABK_MODULE_RECOMMENDED_STAGES="after_patch"
